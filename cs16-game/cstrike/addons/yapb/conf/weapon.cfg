  Normal {
    AK47, M4A1, AWP, Famas, Galil, MP5,
    MAC10, UMP45, TMP, Scout,
    Deagle, P228, FiveSeven, USP, Glock18,
    SG552, AUG, P90, M3, XM1014,
    Elite, SG550, G3SG1, M249, Shield, Knife
  }

  Rusher {
    AK47, M4A1, Galil, Famas, MAC10, MP5,
    TMP, UMP45, AWP,
    Deagle, P228, FiveSeven, USP, Glock18,
    Scout, P90, XM1014, M3, SG552, AUG,
    Elite, SG550, G3SG1, M249, Shield, Knife
  }

  Careful {
    AWP, AK47, M4A1, Famas, Galil, MP5,
    UMP45, MAC10, TMP, Scout,
    Deagle, P228, FiveSeven, USP, Glock18,
    AUG, SG552, P90, XM1014, M3,
    Elite, SG550, G3SG1, M249, Shield, Knife
  }
}
