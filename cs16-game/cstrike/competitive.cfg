// COUNTER-STRIKE 1.6 & XASH3D - COMPETITIVE MATCH & WARMUP CONFIGURATION
// ==============================================================================
echo [Match] Executing CS:GO / CS2 Competitive Match Game Rules...

// Deactivate Deathmatch Engine
redm_active 0

// Activate Competitive Match Engine
amx_csgo_mode 1
amx_csgo_warmup 1
amx_csgo_warmuptime 55
amx_csgo_kniferound 1
amx_csgo_maxrounds 12
amx_csgo_bot_autoready 1
amx_csgo_freezetime 15
amx_csgo_timeouts 1
amx_csgo_lossbonus 1
amx_csgo_hud_style 1
amx_csgo_mvp_card 1

// Standard Competitive Match Mechanics (Warmup Defaults, Restored on Live Match)
mp_roundtime 2.0
mp_freezetime 15
mp_buytime 999.0
mp_buy_anywhere 1
mp_startmoney 800
mp_c4timer 35
mp_round_infinite 0
mp_autoteambalance 1
mp_limitteams 2
mp_freeforall 0
mp_friendlyfire 0
mp_autokick 1
mp_tkpunish 1
mp_item_staytime 0          // 0 during Warmup DM (0 orphan weaponbox leaks); restored to 300 on Knife/Live Match
sv_alltalk 0

// Disable default grenades in Warmup
mp_ct_default_grenades ""
mp_t_default_grenades ""

// YaPB Bot Competitive Settings (Xash3D AI Navigation Sync - Argon Audit)
yb_quota 10
yb_quota_mode fill
yb_ignore_objectives 1      // 1 during Warmup DM (bots roam & ignore bomb sites); dynamically restored to 0 on Knife/Live Match
yb_csdm_mode 1              // 1 during Warmup DM (CSDM team roaming combat); dynamically switched to 3 on Knife/Live Match
yb_botbuy 0                 // 0 during Warmup DM (AMXX injects loadout); dynamically restored to 1 on Live Match
yb_radio_mode 0             // 0 during Warmup DM (no primitive radio spam); dynamically restored to 2 on Live Match
yb_chat 0                   // 0 during Warmup DM; dynamically restored to 1 on Live Match
yb_chat_percent 15
yb_walking_allowed 1
yb_camping_allowed 0
yb_think_fps 40.0           // 40 Hz during Warmup DM for smooth 60 FPS pacing; dynamically restored to 60.0 on Live Match
yb_think_fps_disable 0
yb_shoots_thru_walls 3

// Strict Separation of Concerns (YaPB C++ owns 100% gun-round micro aim/movement/fire)
bot_savage_micro_override 0

// Audio Buffer & Engine Stability (Fixes Xash3D Firefight Looping)
hisound 1
snd_mixahead 0.14
s_combine_sounds 0
s_cull 0
s_a3d 0
s_eax 0
room_off 1

echo [Match] Competitive Match Config Loaded Successfully.
