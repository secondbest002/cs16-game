// ==============================================================================
// CS2 MODERN ENGINE - LOADOUT & INTERACTIVE MENU HOOKS
// ==============================================================================
setinfo _vgui_menus "0"
_vgui_menus "0"
buymenu_stayon "0"
mp_consistency "0"
pausable "1"
// ==============================================================================
// CS2 ARM SWITCHER (MOUSE4 Handedness Toggle & Redraw)
// ==============================================================================
alias "cs2_arm_left"   "cl_righthand 0; cs2_switcharms 0; alias cs2_arm_toggle cs2_arm_right"
alias "cs2_arm_right"  "cl_righthand 1; cs2_switcharms 1; alias cs2_arm_toggle cs2_arm_left"
alias "cs2_arm_toggle" "cs2_arm_left"

bind "MOUSE4" "cs2_arm_toggle"

// Weapon Inspect & Camera Roll Stability (migrated from retired modern_pov.cfg)
sv_rollangle "0"
bind "f" "lookatweapon"
alias weaponlookat "lookatweapon"
alias +weaponlookat "+lookatweapon"
alias -weaponlookat "-lookatweapon"
alias inspect "lookatweapon"

// Standard Weapon Slot Bindings
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"

// Camera & Viewmodel Stability (Reset Modern POV)
cl_viewbob "0"
cl_weaponlag "0"

// ==============================================================================
// CS 1.6 POTATO FPS BOOST ENGINE HOOK
// ==============================================================================
exec fps_boost.cfg
fps_override "1"
fps_max "144"
gl_vsync "1"

// ==============================================================================
// YAPB BOT ERGONOMIC CONSOLE ALIASES
// ==============================================================================
alias "kickbot"   "yb kickall"
alias "kickbots"  "yb kickall"
alias "bot_kick"  "yb kickall"
alias "bot_add"   "yb add"
alias "addbot"    "yb add"
alias "botmenu"   "yb menu"
alias "stopbot"   "yb_stop 1"
alias "startbot"  "yb_stop 0"

// =========================================================================
// XASH3D FWGS NEXT-GEN MATERIAL SYSTEM CONFIGURATION
// Generated by CS 1.6 Asset Studio - EmptyX Customization
// =========================================================================
host_allow_materials 1

// =========================================================================
// XASH3D FWGS AUDIO STABILITY & YAPB AI NAVIGATION REMEDIATION
// Remediation for Audio Looping (Channel Starvation) & TraceHull Divergence
// =========================================================================
s_combine_sounds 0
s_cull 0
yb_walking_allowed 1
yb_think_fps_disable 0

// Diagnostik & Emergency Aliases
alias "audio_desync_fix" "cl_lw 0; cl_lc 0; echo [Audio] Prediction shifted to server."
alias "audio_desync_restore" "cl_lw 1; cl_lc 1; echo [Audio] Prediction restored to client."
alias "yapb_debug_on" "yb_debug 1; yb_debug_goal -1; developer 2; echo [YaPB] Debug mesh ON."
alias "yapb_debug_off" "yb_debug 0; developer 0; echo [YaPB] Debug mesh OFF."
echo "[Xash3D Remediation] Audio stability and YaPB sync cvars active."

