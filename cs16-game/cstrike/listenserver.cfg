// ==============================================================================
// CS 1.6 - Listen Server Standard Match Rules (Clean State)
// ==============================================================================
hostname "Counter-Strike 1.6 (CS2 Custom Edition)"
sv_aim 0
sv_cheats 0
pausable 0
sv_maxspeed 320

// Standard Match Mechanics
mp_roundtime 2.0
mp_freezetime 3
mp_buytime 0.25
mp_startmoney 800
mp_c4timer 35
mp_round_infinite 0
mp_autoteambalance 1
mp_limitteams 2
mp_friendlyfire 0

// Bot Distribution (YaPB Integration)
yb_quota 10
yb_quota_mode "fill"
yb_autovacate 1

// ReGameDLL baseline
exec game.cfg

// Active Launcher GameMode Profile (Competitive or Deathmatch)
exec mode.cfg
