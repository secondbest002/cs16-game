// ==============================================================================
// COUNTER-STRIKE 1.6 & XASH3D - DEATHMATCH CONFIGURATION
// ==============================================================================
echo [ReDM] Executing Deathmatch Game Rules...

// Deactivate Competitive Match Mode
amx_csgo_mode 0

// ReDM Listen Engine Settings
redm_active 1
redm_respawn_delay 1.2
redm_protect_time 2.0
redm_refill_on_kill 1
redm_clean_weapons 1
redm_freeforall 1

// Standard Server Rules for Deathmatch
mp_roundtime 20
mp_timelimit 0
mp_freezetime 0
mp_buytime 999
mp_buy_anywhere 1
mp_startmoney 16000
mp_c4timer 90
mp_limitteams 0
mp_autoteambalance 0
mp_freeforall 1
mp_friendlyfire 1
mp_autokick 0
mp_tkpunish 0
mp_hostagepenalty 0
mp_item_staytime 0
mp_footsteps 1
sv_alltalk 1

// Disable Grenades in Deathmatch
mp_ct_default_grenades ""
mp_t_default_grenades ""

// YaPB Bots Deathmatch Tuning (Clean Audio - No Radio Spam & Corner Sync)
yb_quota 10
yb_quota_mode fill
yb_csdm_mode 2
yb_ignore_objectives 1
yb_botbuy 0
yb_grenadepurchase_percent 0
yb_spraypaints 0
yb_chat 0
yb_radio_mode 0
yb_walking_allowed 0
yb_think_fps 40.0
yb_think_fps_disable 0

// Audio Buffer & Engine Stability (Fixes Menu Buzzing & Firefight Loops)
hisound 1
snd_mixahead 0.14
s_combine_sounds 0
s_cull 0
s_a3d 0
s_eax 0
room_off 1

echo [ReDM] Deathmatch Config Loaded Successfully.
